<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Логово Yanyan — Симулятор Дракона</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f131d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .game-card {
      width: 100%;
      max-width: 420px;
      background: #1a202c;
      border: 3px solid #ff9d00;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(255, 157, 0, 0.2);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-box h1 {
      font-size: 1.2rem;
      color: #ffb703;
    }
    .currency {
      background: #2d3748;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      color: #38bdf8;
      border: 1px solid #4a5568;
    }
    .screen {
      position: relative;
      width: 100%;
      height: 260px;
      background: linear-gradient(to bottom, #1e1b4b, #311042);
      border-radius: 16px;
      border: 2px solid #4c1d95;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screen.night {
      background: linear-gradient(to bottom, #090514, #110926);
    }
    .dragon-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: hover 3s ease-in-out infinite;
      cursor: pointer;
    }
    .dragon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
      transition: transform 0.2s;
    }
    .dragon-container:active .dragon-img {
      transform: scale(0.95);
    }
    @keyframes hover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    .stat-box {
      background: #2d3748;
      padding: 8px 12px;
      border-radius: 12px;
    }
    .stat-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 4px;
      color: #cbd5e0;
    }
    .bar {
      width: 100%;
      height: 8px;
      background: #1a202c;
      border-radius: 4px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }
    .f-hunger { background: #f6ad55; }
    .f-happy { background: #f687b3; }
    .f-energy { background: #63b3ed; }
    .f-health { background: #68d391; }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .btn {
      background: #312e81;
      border: 1px solid #4338ca;
      color: #fff;
      padding: 12px 6px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.1s;
    }
    .btn:hover {
      background: #3730a3;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-feed { border-color: #f6ad55; }
    .btn-play { border-color: #f687b3; }
    .btn-clean { border-color: #4fd1c5; }
    .btn-sleep { border-color: #63b3ed; }
    .btn-heal { border-color: #68d391; }
    .btn-hunt { border-color: #f6e05e; }

    .zzz {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 1.5rem;
      opacity: 0;
    }
    .screen.night .zzz {
      animation: sleepZ 2s infinite;
    }
    @keyframes sleepZ {
      0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(15px, -20px) scale(1.2); }
    }
  </style>
</head>
<body>

<div class="game-card">
  <div class="header">
    <div class="title-box">
      <h1>Логово Yanyan 🐉</h1>
    </div>
    <div class="currency">💎 <span id="gems">100</span></div>
  </div>

  <div class="screen" id="screen">
    <div class="zzz">💤</div>
    <div class="dragon-container" onclick="petDragon()">
      <img id="dragon-img" class="dragon-img" src="" alt="Yanyan">
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label"><span>🍖 Сытость</span><span id="v-hunger">80%</span></div>
      <div class="bar"><div class="fill f-hunger" id="b-hunger"></div></div>
    </div>
    <div class="stat-box">
      <div class="stat-label"><span>💖 Радость</span><span id="v-happy">80%</span></div>
      <div class="bar"><div class="fill f-happy" id="b-happy"></div></div>
    </div>
    <div class="stat-box">
      <div class="stat-label"><span>⚡ Энергия</span><span id="v-energy">100%</span></div>
      <div class="bar"><div class="fill f-energy" id="b-energy"></div></div>
    </div>
    <div class="stat-box">
      <div class="stat-label"><span>🧪 Здоровье</span><span id="v-health">100%</span></div>
      <div class="bar"><div class="fill f-health" id="b-health"></div></div>
    </div>
  </div>

  <div class="actions-grid">
    <button class="btn btn-feed" onclick="feed()">🍖 Кормить</button>
    <button class="btn btn-play" onclick="play()">⚽ Играть</button>
    <button class="btn btn-sleep" onclick="toggleSleep()">🌙 Сон</button>
    <button class="btn btn-heal" onclick="heal()">🧪 Лечить</button>
    <button class="btn btn-hunt" onclick="hunt()">💎 Охота</button>
    <button class="btn btn-clean" onclick="clean()">ПОЧИСТИТЬ</button>
  </div>
</div>

<script>
  // === КАДРЫ АНИМАЦИИ ДРАКОНА ===
  const dragonFrames = [
    "images/frame1.png",
    "images/frame2.png"
  ];

  let currentFrame = 0;
  const dragonImgElement = document.getElementById('dragon-img');

  if (dragonFrames.length > 0) {
    dragonImgElement.src = dragonFrames[0];
  }

  let state = {
    hunger: 80,
    happy: 80,
    energy: 100,
    health: 100,
    gems: 100,
    isSleeping: false
  };

  function updateUI() {
    document.getElementById('gems').innerText = state.gems;
    document.getElementById('v-hunger').innerText = Math.round(state.hunger) + '%';
    document.getElementById('b-hunger').style.width = state.hunger + '%';
    document.getElementById('v-happy').innerText = Math.round(state.happy) + '%';
    document.getElementById('b-happy').style.width = state.happy + '%';
    document.getElementById('v-energy').innerText = Math.round(state.energy) + '%';
    document.getElementById('b-energy').style.width = state.energy + '%';
    document.getElementById('v-health').innerText = Math.round(state.health) + '%';
    document.getElementById('b-health').style.width = state.health + '%';
  }

  function feed() {
    if (state.hunger < 100) {
      state.hunger = Math.min(100, state.hunger + 20);
      updateUI();
    }
  }

  function play() {
    if (state.energy >= 15) {
      state.happy = Math.min(100, state.happy + 20);
      state.energy = Math.max(0, state.energy - 15);
      state.gems += 5;
      updateUI();
    }
  }

  function toggleSleep() {
    state.isSleeping = !state.isSleeping;
    document.getElementById('screen').classList.toggle('night', state.isSleeping);
  }

  function heal() {
    if (state.gems >= 10 && state.health < 100) {
      state.gems -= 10;
      state.health = 100;
      updateUI();
    }
  }

  function hunt() {
    state.gems += 15;
    state.energy = Math.max(0, state.energy - 20);
    updateUI();
  }

  function clean() {
    state.happy = Math.min(100, state.happy + 10);
    updateUI();
  }

  function petDragon() {
    state.happy = Math.min(100, state.happy + 5);
    updateUI();
  }

  // Анимация смены кадров каждые 400 миллисекунд
  setInterval(() => {
    if (!state.isSleeping && dragonFrames.length > 0) {
      currentFrame = (currentFrame + 1) % dragonFrames.length;
      dragonImgElement.src = dragonFrames[currentFrame];
    }
  }, 400);

  // Уменьшение статов со временем
  setInterval(() => {
    if (state.isSleeping) {
      state.energy = Math.min(100, state.energy + 5);
    } else {
      state.hunger = Math.max(0, state.hunger - 1);
      state.happy = Math.max(0, state.happy - 1);
      state.energy = Math.max(0, state.energy - 0.5);
    }
    updateUI();
  }, 3000);

  updateUI();
</script>

</body>
</html>
